services:
  app:
    build: .
    container_name: watcher_back
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=watcher_user
      - DB_PASSWORD=watcher_password
      - DB_NAME=watcher
      - DB_SYNCHRONIZE=true
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: watcher_postgres
    environment:
      - POSTGRES_USER=watcher_user
      - POSTGRES_PASSWORD=watcher_password
      - POSTGRES_DB=watcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: