services:
  app:
    build: .
    container_name: watcher_back
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=watcher_user
      - DB_PASSWORD=watcher_password
      - DB_NAME=watcher
      - DB_SYNCHRONIZE=true
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - postgres
      - db-setup
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: watcher_postgres
    environment:
      - POSTGRES_USER=watcher_user
      - POSTGRES_PASSWORD=watcher_password
      - POSTGRES_DB=watcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data # Mount data directory for CSV files
      - ./init-scripts:/docker-entrypoint-initdb.d # Mount init scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher_user -d watcher"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-setup:
    image: postgres:15-alpine
    container_name: watcher_db_setup
    depends_on:
      - postgres
    environment:
      - PGPASSWORD=watcher_password
    volumes:
      - ./init-scripts:/init-scripts
      - ./data:/data
    entrypoint: >
      sh -c "
        until pg_isready -h postgres -U watcher_user -d watcher; do
          echo 'Waiting for postgres...';
          sleep 2;
        done;
        psql -v ON_ERROR_STOP=1 -h postgres -U watcher_user -d watcher -f /init-scripts/01-create-udemy-table.sql
      "
    restart: "no"

volumes:
  pgdata:
  app_node_modules:
